name: CI

on:
  push:
  pull_request:

jobs:
  powershell-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\InstallerManager.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { $_.Message }
            exit 1
          }

      - name: Compile Python files when available
        shell: pwsh
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          if ($python) {
            python -m py_compile installer_manager\core.py installer_manager\gui.py run_installer_app.py
          } else {
            Write-Host "Python is not installed on this runner image path."
          }
