<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- 背景渐变:深蓝到品牌蓝 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="55%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#01579B"/>
    </linearGradient>
    <!-- 箭头渐变:青蓝到亮蓝 -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <!-- 托盘渐变 -->
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#80DEEA"/>
      <stop offset="100%" stop-color="#26C6DA"/>
    </linearGradient>
    <!-- 柔和阴影 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#bgGrad)"/>

  <!-- 内层微妙高光(顶部反光) -->
  <rect x="8" y="8" width="240" height="120" rx="56" ry="56" fill="#FFFFFF" opacity="0.06"/>

  <!-- 中央向下箭头(代表安装/部署) -->
  <g filter="url(#softShadow)">
    <!-- 箭头杆 -->
    <rect x="108" y="56" width="40" height="92" rx="14" ry="14" fill="url(#arrowGrad)"/>
    <!-- 箭头头(三角) -->
    <path d="M 128 196 L 70 138 Q 64 132 70 132 L 186 132 Q 192 132 186 138 Z"
          fill="url(#arrowGrad)"/>
  </g>

  <!-- 底部托盘横条(代表安装到位/接收) -->
  <g filter="url(#softShadow)">
    <rect x="56" y="206" width="144" height="20" rx="10" ry="10" fill="url(#trayGrad)"/>
  </g>
</svg>
